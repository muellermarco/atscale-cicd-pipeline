# ============================================================================
# Pipeline registry — THE single source of truth for onboarded model repos.
# One entry per repo; generate_dags.py turns each into its own set of DAGs:
#
#   deploy_dev__<slug>        manual, param branch  → dev instance
#   deploy_qa__<slug>         GitHub Action on merge to main → qa instance
#   release_live__<slug>      GitHub Action on tag vX.Y → live instance
#   usage_trace__<slug>       weekly machine PR   (only if usage_trace: true)
#   nightly__<slug>           parity check qa/live (only if nightly.catalog)
#
# Onboard a repo = add an entry here (PR) + drop the 3 stub workflows into the
# model repo (onboarding/onboard.py does the rest). Deploy DAGs start
# UNPAUSED; machine DAGs start paused (they need the github-token secret).
# ============================================================================

defaults:
  atscale_domain: atscale-se-demo.com     # dev/qa/prod.<domain>; Airflow Variable atscale_domain overrides
  sml_cli: sml-cli@2025.12.0
  node_image: node:20-bookworm

pipelines:
  # --- Sales Insights ---
  - slug: salesinsights-snowflake
    enabled: true
    repo: muellermarco/sml-salesinsights-snowflake
    dev_catalog_prefix: SalesInsights-SF
    openmetadata:                      # post-release sync to OpenMetadata (tools/om_sync.py)
      warehouse_service: snowflake_partner   # OM database service name — must match the UI
  - slug: salesinsights-databricks
    enabled: true
    repo: muellermarco/sml-salesinsights-databricks
    dev_catalog_prefix: SalesInsights-DBX
    openmetadata:
      warehouse_service: databricks          # OM database service (catalog hive_metastore)
  - slug: salesinsights-gbq
    enabled: true
    repo: muellermarco/sml-salesinsights-gbq
    dev_catalog_prefix: SalesInsights-GBQ
    openmetadata:
      warehouse_service: gbq                 # OM database service (project atscale-sales-demo)

  # sml-salesinsights-common is a shared PACKAGE repo (no catalog, per-warehouse
  # branches) — NOT on this pipeline: no registry entry, no stub workflows.
  # It is validated indirectly through every consuming repo's validate run.

  # --- TPC-DS (Snowflake, SE_DEMO_LIBRARY.TPCDS_10TB) ---
  - slug: tpcds-snowflake
    enabled: true
    repo: muellermarco/sml-tpcds-snowflake
    dev_catalog_prefix: TPCDS-SF
    openmetadata:
      warehouse_service: snowflake_partner   # reads Snowflake Partner (SE_DEMO_LIBRARY.TPCDS_10TB)

  # sml-tpcds-common is the shared PACKAGE repo pulled in by sml-tpcds-snowflake's
  # package.yml (pinned commit) — NOT on this pipeline: no registry entry, no stub
  # workflows. It is registered on dev/qa/prod as repo 'tpcds-common' so Design
  # Center can resolve the package, and validated through the consuming repo.

  # --- CI/CD demo customer (empty repo at onboarding, 2026-10-15: add an openmetadata block once the warehouse is known) ---
  - slug: cicd-demo-customer
    enabled: true
    repo: muellermarco/sml-cicd-demo-customer
    dev_catalog_prefix: CICD-Demo-Customer

  # --- Customer POC: TVH (BigQuery via instance connection TVH_BigQuery; no openmetadata block, no OM service for it) ---
  - slug: poc-tvh
    enabled: true
    repo: muellermarco/sml-poc-tvh
    private: true                      # clone via github-token secret
    dev_catalog_prefix: POC-TVH

  # --- Sector demo models: one repo per sector (sml-sector-model-<sector>), catalog at the repo root ---
  # Every sector repo is synced to OpenMetadata after a live release (tools/om_sync.py).
  - slug: sector-adtech
    enabled: true
    repo: muellermarco/sml-sector-model-adtech
    private: true                      # clone via github-token secret
    dev_catalog_prefix: Sector-Adtech
    openmetadata:
      warehouse_service: snowflake_partner   # all sector models read Snowflake Partner (<SECTOR>_DEMO dbs)
  - slug: sector-finserv
    enabled: true
    repo: muellermarco/sml-sector-model-finserv
    private: true                      # clone via github-token secret
    dev_catalog_prefix: Sector-Finserv
    openmetadata:
      warehouse_service: snowflake_partner   # all sector models read Snowflake Partner (<SECTOR>_DEMO dbs)
