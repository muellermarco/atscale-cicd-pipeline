# ============================================================================
# Pipeline registry — THE single source of truth for onboarded model repos.
# One entry per repo; generate_dags.py turns each into its own set of DAGs:
#
#   deploy_dev__<slug>        manual, param branch  → dev instance
#   deploy_qa__<slug>         GitHub Action on merge to main → qa instance
#   release_live__<slug>      GitHub Action on tag vX.Y → live instance
#   baseline_refresh__<slug>  weekly machine PR   (only if baseline_upstream)
#   usage_trace__<slug>       weekly machine PR   (only if usage_trace: true)
#   nightly__<slug>           parity check qa/live (only if nightly.catalog)
#
# Onboard a repo = add an entry here (PR) + drop the 3 stub workflows into the
# model repo (onboarding/onboard.py does the rest). Deploy DAGs start
# UNPAUSED; machine DAGs start paused (they need the github-token secret).
# ============================================================================

defaults:
  atscale_domain: atscale-se-demo.com     # dev/qa/prod.<domain>; Airflow Variable atscale_domain overrides
  sml_cli: sml-cli@2025.12.0
  node_image: node:20-bookworm

pipelines:
  # --- Sales Insights ---
  - slug: salesinsights-snowflake
    enabled: true
    repo: muellermarco/sml-salesinsights-snowflake
    dev_catalog_prefix: SalesInsights-SF
    openmetadata:                      # post-release sync to OpenMetadata (tools/om_sync.py)
      warehouse_service: snowflake_partner   # OM database service name — must match the UI
      packages: [muellermarco/sml-salesinsights-common]
  - slug: salesinsights-databricks
    enabled: true
    repo: muellermarco/sml-salesinsights-databricks
    dev_catalog_prefix: SalesInsights-DBX
  - slug: salesinsights-gbq
    enabled: true
    repo: muellermarco/sml-salesinsights-gbq
    dev_catalog_prefix: SalesInsights-GBQ

  # sml-salesinsights-common is a shared PACKAGE repo (no catalog, per-warehouse
  # branches) — NOT on this pipeline: no registry entry, no stub workflows.
  # It is validated indirectly through every consuming repo's validate run.
